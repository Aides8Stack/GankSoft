/* v0.7.5 Knowledge graph: compact toolbar, editable Markdown details and MD exchange. */
.knowledge-workbench{overflow:hidden;min-width:0}
.knowledge-mapbar{min-height:50px;padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.knowledge-view-tabs{margin:0;width:min(252px,100%);flex:0 0 auto}
.knowledge-view-tabs button{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.knowledge-view-tabs svg{width:14px;height:14px}
.knowledge-map-controls{flex-wrap:wrap;gap:6px}
.knowledge-map-controls .icon-button{height:29px;width:29px;font-size:19px;font-weight:500}
.knowledge-map-controls .button.small{font-size:11px}
.knowledge-workbench .map-layout{height:min(67vh,650px);min-height:430px;grid-template-columns:minmax(0,1fr) 292px}
.knowledge-workbench .map-layout.no-side{grid-template-columns:minmax(0,1fr)}
.knowledge-map-canvas{position:relative;overflow:hidden;touch-action:none;cursor:grab}
.knowledge-map-canvas:active{cursor:grabbing}
.knowledge-map-transform{position:absolute;left:38px;top:50%;width:max-content;transform-origin:0 50%;user-select:none;will-change:transform}
.knowledge-branch{display:flex;align-items:center;gap:24px;position:relative}
.knowledge-branch>.knowledge-node{flex:none}
.knowledge-node.map-node{position:relative;left:auto;top:auto;cursor:pointer;min-width:91px;max-width:180px;text-align:center;font-size:11.5px;padding:10px 12px;white-space:normal;line-height:1.45}
.knowledge-node.map-node small{font-size:10px;margin-top:3px}
.knowledge-children{display:flex;flex-direction:column;align-items:flex-start;gap:11px;padding-left:24px;margin-left:0;border-left:2px solid #c5ddca;position:relative}
.knowledge-children::before{content:"";position:absolute;left:-25px;top:50%;width:24px;border-top:2px solid #c5ddca}
.knowledge-child-row{display:flex;align-items:center;position:relative;min-height:36px}
.knowledge-child-row::before{content:"";position:absolute;left:-26px;top:50%;width:25px;border-top:2px solid #c5ddca}
.knowledge-map-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 15px;border-top:1px solid var(--border);background:#fff}
.knowledge-side{overflow:auto;padding:16px 17px}
.knowledge-side .detail-top{display:flex;justify-content:space-between;align-items:center}
.knowledge-side-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:15px 0 14px}
.knowledge-side-stats span{background:var(--soft);border-radius:8px;padding:10px 5px;min-width:0;text-align:center}
.knowledge-side-stats strong{display:block;color:var(--primary-dark);font-size:17px}
.knowledge-side-stats small{display:block;margin-top:4px;color:var(--muted);font-size:9px}
.knowledge-md-preview{min-height:92px;max-height:190px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8f6;border:1px solid var(--border);border-radius:8px;padding:12px;color:#566e5d;font-size:11.5px;line-height:1.75}
.knowledge-md-field{min-height:160px;max-height:320px;font-size:11.5px}
.knowledge-side-bottom{display:flex;gap:8px;align-items:center;margin-top:13px}
.knowledge-outline{background:#fff;overflow:auto;padding:18px 14px;min-width:0}
.knowledge-outline-line{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid #f0f2f1}
.knowledge-outline-line .outline-node{border:0;background:none;color:#4f6658;text-align:left;font-size:12.5px;font-weight:650;padding:7px 9px;border-radius:6px;white-space:nowrap}
.knowledge-outline-line .outline-node:hover,.knowledge-outline-line .outline-node.selected{background:var(--primary-soft);color:var(--primary-dark)}
.knowledge-outline-line .outline-node code{font-size:11px;color:#98a7a0;font-weight:400;margin-right:5px}
.knowledge-outline-line .tiny-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%;font-size:10.5px}
.knowledge-fullscreen{position:fixed!important;inset:46px 18px 16px max(230px,15vw);z-index:12;background:#fff;border:1px solid var(--border-strong);box-shadow:0 20px 70px #204b3026;display:flex;flex-direction:column}
.knowledge-fullscreen .map-layout{height:auto;min-height:0;flex:1}
.knowledge-import-overview{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.knowledge-file-tools{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.knowledge-md-source{min-height:240px;line-height:1.6;white-space:pre;overflow:auto;resize:vertical;font-size:12px}
.knowledge-export-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.knowledge-export-tools .select{min-width:min(350px,100%)}
.knowledge-preview-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}
.knowledge-preview-counts span{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:11px 9px;font-size:11px;color:var(--muted);text-align:center}
.knowledge-preview-counts strong{display:block;font-size:19px;color:var(--primary-dark);margin-top:5px}
.knowledge-import-paths{min-height:90px;max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:5px 11px;margin-bottom:10px}
.knowledge-import-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--border);font-size:11.5px;word-break:break-word}
.knowledge-import-row:last-child{border-bottom:0}
.md-error{background:#fff1ef;border:1px solid #efc7c0;color:#a9423b;border-radius:8px;padding:11px 13px;font-size:12px;margin-top:12px}
@media(max-width:1100px){.knowledge-workbench .map-layout{grid-template-columns:minmax(0,1fr) 255px}.knowledge-mapbar{align-items:flex-start}.knowledge-map-controls{justify-content:flex-start}}
@media(max-width:850px){.knowledge-workbench .map-layout{height:auto;min-height:0;grid-template-columns:1fr}.knowledge-map-canvas{min-height:460px}.knowledge-workbench .map-layout.no-side{display:block}.knowledge-workbench .map-side{display:block;border-left:0;border-top:1px solid var(--border);max-height:320px}.knowledge-outline{min-height:380px;max-height:520px}.knowledge-fullscreen{inset:54px 6px 8px 70px}.knowledge-fullscreen .map-layout{overflow:auto}}
@media(max-width:610px){.knowledge-view-tabs{width:100%}.knowledge-map-controls{width:100%}.knowledge-preview-counts{grid-template-columns:repeat(2,minmax(0,1fr))}.knowledge-fullscreen{inset:52px 5px 8px 5px}.knowledge-exchange-dialog .dialog-footer{flex-wrap:wrap}.knowledge-exchange-dialog .dialog-footer .left{width:100%;margin-bottom:4px}.knowledge-export-tools .select{width:100%}}

/* v0.7.5 Multi-root knowledge forest + dedicated Markdown exchange subpage. */
.forest-stack{display:flex;flex-direction:column;align-items:flex-start;gap:30px;width:max-content;min-width:240px}
.forest-root{display:flex;align-items:center;padding:8px 0;position:relative;min-height:44px}
.graph-node-wrap{position:relative;display:flex;align-items:center;flex:none}
.graph-node-wrap .knowledge-node.map-node{flex:none}
.graph-fold{position:absolute;right:-14px;top:-11px;height:22px;width:22px;border:1px solid var(--border-strong);background:#fff;color:var(--muted);border-radius:6px;font-size:15px;cursor:pointer;z-index:2}
.graph-fold:hover,.graph-fold:focus-visible{background:var(--primary-soft);color:var(--primary-dark);outline:2px solid #b1d7c6}
.knowledge-node.highlight{background:#dceddf!important;border:2px solid #438d69!important;color:#1c6047!important;box-shadow:0 0 0 3px #b5d9c652!important}
.knowledge-node.graph-added{background:#e7f7eb;border:2px dashed #38a266;box-shadow:0 0 0 3px #39a26820}
.knowledge-node.graph-updated{background:#fff4df;border:2px dashed #cb8c36}
.knowledge-node.graph-matched{outline:1px dotted #779d89;outline-offset:2px}
.knowledge-node.graph-added.highlight,.knowledge-node.graph-updated.highlight{outline:3px solid #1d7255;outline-offset:3px}
.knowledge-node em{font-style:normal;display:block;font-size:9px;font-weight:650;margin-top:3px;color:#22824e}
.knowledge-node.graph-updated em{color:#a96d1d}
.knowledge-outline-root{margin-bottom:18px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.knowledge-outline-root>.knowledge-outline-line{background:#f6f9f7}
.knowledge-transfer-shell{overflow:hidden;min-height:570px}
.transfer-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding:10px 16px;min-height:54px}
.transfer-mode-tabs{width:min(310px,100%)}
.transfer-mode-tabs button{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.transfer-mode-tabs svg{width:14px;height:14px}
.transfer-topline-note{display:flex;align-items:center;gap:9px}
.knowledge-transfer-layout{display:grid;grid-template-columns:minmax(0,1.13fr) minmax(350px,.87fr);height:min(74vh,765px);min-height:540px}
.transfer-visual{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border);background:#fff}
.transfer-visual-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 15px;min-height:59px;border-bottom:1px solid var(--border)}
.transfer-visual-head>div:first-child{display:flex;flex-direction:column;gap:4px}
.transfer-visual-head>div:first-child strong{font-size:12.5px}
.transfer-visual-head .compact-actions{gap:5px;flex-wrap:wrap}
.transfer-visual-head .icon-button{width:27px;height:27px;font-size:17px}
.transfer-visual-head .button.small{padding:6px 9px;font-size:10.5px}
.zoom-percent{color:var(--muted);font-size:11px;min-width:36px;text-align:center}
.transfer-map{flex:1;position:relative;overflow:hidden;min-width:0;background-color:#fbfdfb;background-image:radial-gradient(#d8e6dc 1px,transparent 1px);background-size:19px 19px;cursor:grab;touch-action:none}
.transfer-map:active{cursor:grabbing}

.transfer-visual-foot{min-height:38px;padding:8px 11px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.transfer-legend{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.transfer-legend span{display:inline-flex;align-items:center;gap:5px}
.transfer-legend i{width:9px;height:9px;border-radius:3px;background:#dceddf;border:1px solid #438d69}
.transfer-legend .legend-added{background:#e7f7eb;border-color:#38a266}
.transfer-legend .legend-update{background:#fff4df;border-color:#cb8c36}
.transfer-right{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.transfer-right-scroll{overflow:auto;min-height:0;flex:1;padding:15px 17px}
.transfer-right-scroll h3{font-size:13px;margin:12px 0 9px}
.transfer-right-scroll .small-muted{line-height:1.6;font-size:11px}
.transfer-steps{display:flex;gap:12px;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid var(--border);color:#a9b2ae;font-size:10.5px}

.transfer-position{margin:10px 0 8px;width:100%;max-width:420px}
.transfer-hint{background:#f4f8f6;border:1px solid #e0ece3;border-radius:8px;padding:9px 11px;color:#6c8175;font-size:10.5px;line-height:1.6}

.transfer-picker{margin-top:14px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.transfer-picker-head{padding:10px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}

.transfer-tree-list{padding:3px 5px 8px;max-height:196px;overflow:auto;scrollbar-color:#cfdbd2 transparent}

.transfer-tree-choice{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:30px;text-align:left;background:transparent;border:0;padding:0 6px;color:#314c3d;cursor:pointer;font-size:11px}
.transfer-choice-mark{width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid #b9c9be;color:#fff;font-size:10px}
.transfer-choice-mark.radio-mark{border-radius:50%}
.transfer-choice-mark.check-mark{border-radius:4px}
.transfer-tree-row.is-picked .transfer-choice-mark{background:#2c705e;border-color:#2c705e}
.transfer-tree-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transfer-tree-count{margin-left:auto;font-size:9px;color:#9aa8a0;white-space:nowrap}
.transfer-md-source{margin-top:17px}

.transfer-file-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.transfer-md-source textarea{width:100%;height:144px;min-height:116px;font-size:11.2px;resize:vertical;line-height:1.7}
.transfer-check{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.5;margin-top:11px}
.transfer-check input{margin-top:2px}
.transfer-right-footer{padding:11px 13px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:0 -4px 12px #1e3c2510}
.transfer-right-footer .button{font-size:11px}
.transfer-right-footer .button:first-child{margin-right:auto}
.transfer-preview-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:11px 0 14px}
.transfer-preview-stats span{background:#f4f8f5;border-radius:7px;border:1px solid var(--border);padding:9px;font-size:10.5px;color:var(--muted)}

.transfer-change-list{border:1px solid var(--border);border-radius:9px;padding:6px 10px;max-height:312px;overflow:auto}
.transfer-change-item{display:flex;align-items:flex-start;gap:10px;padding:8px 1px;border-bottom:1px solid var(--border);font-size:10.8px;overflow-wrap:anywhere}
.transfer-change-item:last-child{border-bottom:0}
.change-kind{flex:none;color:#427b5a;background:#e5f5e9;padding:3px 6px;border-radius:5px;font-size:9px}
.change-kind.updated{color:#a46c22;background:#fff2df}
.change-kind.kept{color:#73867a;background:#edf2ef}
.transfer-file-preview{min-height:330px;max-height:445px;width:100%;resize:vertical;white-space:pre;tab-size:2;overflow:auto;font:11.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#334d3f}
@media(max-width:1100px){.knowledge-transfer-layout{grid-template-columns:minmax(0,1fr) minmax(330px,.9fr)}.transfer-visual-head .compact-actions{justify-content:flex-start}.transfer-topline-note{display:none}}
@media(max-width:800px){.knowledge-transfer-layout{display:flex;flex-direction:column;height:auto;min-height:0}.transfer-visual{min-height:415px;border-right:0;border-bottom:1px solid var(--border)}.transfer-map{min-height:340px}.transfer-right-scroll{max-height:none}.transfer-tree-list{max-height:230px}.knowledge-transfer-shell{min-height:0}}
@media(max-width:550px){.transfer-visual-head{flex-direction:column;align-items:flex-start}.transfer-mode-tabs{width:100%}.transfer-right-footer{justify-content:stretch}.transfer-right-footer .button{flex:1}.transfer-right-footer .button:first-child{margin-right:0}}
.content-container.wide-knowledge{max-width:1510px;padding:22px 26px 45px}
.content-container.wide-knowledge .page-heading{margin-bottom:16px}
@media(max-width:900px){.content-container.wide-knowledge{padding:17px 16px 35px}}

/* v0.7.5 showcase review: selection-dependent actions, card detail, settings recycle bin.
   Presentation only: no production data and no backend dependencies. */
.card-collection-panel{min-width:0}
.card-collection-panel .data-table{width:100%}
.card-collection-panel .data-table td:first-child,
.card-collection-panel .data-table th:first-child{width:38px;text-align:center}
.card-collection-panel .data-table input[type=checkbox],
.trash-list-head input[type=checkbox],.trash-item>input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.card-title-link{padding:0;border:none;background:transparent;text-align:left;color:var(--ink);font-weight:680;font-size:12px;line-height:1.5;max-width:100%;overflow-wrap:anywhere}
.card-title-link:hover{color:var(--primary);text-decoration:underline}
.data-table tr.is-row-selected{background:#f3faf6}
.card-collection-panel .row-actions{display:flex;align-items:center;gap:9px;white-space:nowrap}
.bulk-action-bar{display:flex;justify-content:space-between;align-items:center;gap:10px 18px;background:#edf6f0;border:1px solid #cde2d3;border-radius:9px;padding:10px 13px;margin:12px 0 14px;flex-wrap:wrap}
.bulk-action-info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bulk-action-info strong,.trash-bulk>strong{font-size:12px;color:#2b5b46}
.bulk-action-buttons{justify-content:flex-end;flex:1}
.button.danger-outline{color:#a7433e;border-color:#eccbca;background:#fff}
.button.danger-outline:hover{color:#962e2a;background:#fff0f0;border-color:#d9b3b1}
.danger-text{color:#b24d49}
.list-bottom-note{display:flex;justify-content:space-between;gap:12px;margin-top:14px}
.selection-session-note{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:2px 0 13px;background:#eef6f0;border:1px solid #d4e6d9;border-radius:9px;padding:12px 16px;font-size:12px;color:#386a50}
.selection-session-note svg{width:16px;height:16px}
.selection-session-note .text-button{margin-left:auto}
.card-detail-head .section-heading{align-items:flex-start}
.card-detail-head .section-heading h2{font-size:17px;line-height:1.5}
.card-detail-head .small-muted{margin:7px 0 0}
.detail-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border);padding-top:18px;gap:15px;margin-top:19px}
.detail-metrics>div{display:flex;flex-direction:column;gap:7px;min-width:0}
.detail-metrics>div>span{color:var(--muted);font-size:11px}
.detail-metrics>div>strong{font-size:17px;font-weight:720}
.trash-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:14px;margin-bottom:17px;font-size:12px;color:var(--muted)}
.trash-intro p{max-width:560px}
.page-badge{font-size:10px;border-radius:5px;padding:5px 8px;background:var(--soft);color:var(--muted);white-space:nowrap}
.trash-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:13px}
.trash-tabs button{background:transparent;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 15px;display:flex;gap:7px;align-items:center;font-weight:600;font-size:12px;color:var(--muted)}
.trash-tabs button.active{border-bottom-color:var(--primary);color:var(--primary)}
.trash-tabs button:hover{background:var(--soft)}
.trash-tabs button span{font-size:10px;padding:1px 5px;background:var(--soft);border-radius:5px}
.trash-list-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;margin:12px 0;padding:0 7px}
.trash-list-head label{display:flex;align-items:center;gap:10px;cursor:pointer}
.trash-item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-top:1px solid var(--border);min-height:66px}
.trash-item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.trash-item-main strong{font-size:12px;overflow-wrap:anywhere}
.trash-item-main small{color:var(--muted);font-size:11px}
.trash-item-actions{display:flex;gap:8px;align-items:center}
.dialog-field-preview{border:1px solid var(--border);background:#f8faf8;padding:12px 13px;border-radius:8px;margin-top:13px;font-size:12px;line-height:1.8;max-height:180px;overflow:auto}
.dialog-field-preview strong{display:block;margin-bottom:7px}
.dialog-field-preview>div{color:var(--muted);overflow-wrap:anywhere}
@media(max-width:1060px){.detail-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.bulk-action-buttons{justify-content:flex-start;flex:initial}.trash-intro{flex-direction:column}}
@media(max-width:720px){.bulk-action-bar{align-items:flex-start}.trash-item{flex-wrap:wrap}.trash-item-actions{margin-left:27px}.card-collection-panel .data-table{min-width:660px}.list-bottom-note{flex-wrap:wrap}.selection-session-note .text-button{margin-left:0}}
/* Small, discoverable draft inbox and context-preserving editor back button. */
.editor-title-group{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.editor-back{color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:0}
.editor-back svg{width:15px;height:15px}
.editor-head>.compact-actions{align-self:center}
.draft-preview-row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--border)}
.draft-preview-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.draft-preview-main strong{font-size:12px;overflow-wrap:anywhere}
.draft-preview-main small{font-size:11px;color:var(--muted)}
@media(max-width:680px){.draft-preview-row{flex-wrap:wrap}.editor-head>.compact-actions{align-self:flex-start}}

/* v0.7.5 UX review iteration — presentation-only refinements, not business code. */
.content-scroller.workbench-scroller{overflow:hidden}

.knowledge-workbench .knowledge-view-tabs{flex:none;width:275px;max-width:55%;margin:0}
.knowledge-mapbar>.tiny-meta,.fullscreen-title{font-size:11px;color:#84948b}

.knowledge-side{display:flex;flex-direction:column;min-height:0}
.knowledge-side>.section-heading{flex:none}
.knowledge-side>.knowledge-md-preview{flex:1}
.knowledge-side .knowledge-side-bottom{flex:none;margin-top:12px}
.knowledge-side>.fineprint{flex:none}
.markdown-demo .md-line{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.markdown-demo .md-blank{height:9px}
.markdown-demo .md-subheading{font-weight:700;color:#274d3e;font-size:12.5px;margin:11px 0 6px}
.markdown-demo .md-bullet{padding-left:9px;margin:3px 0}
.markdown-demo code,.outline-rendered-markdown code{font-family:Consolas,monospace;background:#e6ede8;padding:2px 4px;border-radius:4px}
.markdown-demo math,.outline-rendered-markdown math{font-size:17px;vertical-align:middle;margin:0 4px}
.md-media-placeholder{display:inline-block;color:#4d7b66;border:1px dashed #9ebca9;background:#f0f7f3;border-radius:5px;padding:4px 8px}

.knowledge-fullscreen{position:fixed!important;inset:0!important;z-index:90!important;background:white;border:0!important;border-radius:0!important;box-shadow:none!important;width:100vw;height:100dvh;max-width:none;max-height:none}
.knowledge-fullscreen .knowledge-mapbar{min-height:59px;background:white;padding:10px 18px}
.knowledge-fullscreen .fullscreen-exit{font-size:12px;min-height:36px;border-color:#b4d1c2;color:#245b47;background:#f1f7f3}
.knowledge-fullscreen .map-layout{flex:1;min-height:0;height:auto!important;overflow:hidden!important;display:flex!important}
.knowledge-fullscreen .map-layout .knowledge-map-canvas{min-height:0!important;flex:1}
.knowledge-fullscreen .map-layout .knowledge-side{max-height:none!important}

#overlay-root .modal-backdrop{z-index:1000}
/* Document-style outline with node title + independently editable Markdown block. */
.knowledge-workbench .knowledge-outline{flex:1;min-height:0;max-height:none;overflow:auto;padding:14px 21px;background:#fff}
.knowledge-outline-toc{width:clamp(220px,23vw,320px);flex:none;min-height:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:#fafcfb}
.knowledge-outline-toc .toc-head{padding:16px 14px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:7px;align-items:center}
.knowledge-outline-toc .toc-head strong{font-size:12px}
.knowledge-outline-toc .toc-head small{color:var(--muted);font-size:10px}
.knowledge-outline-toc .toc-scroll{min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:9px}
.outline-toc-item{border:0;background:transparent;border-radius:6px;padding:9px 8px;display:flex;gap:8px;text-align:left;color:#65756c;font-size:12px;cursor:pointer}
.outline-toc-item:hover,.outline-toc-item.active{background:var(--primary-soft);color:var(--primary-dark)}

.knowledge-document-heading{display:flex;align-items:center;gap:10px;padding:9px 12px 9px calc(10px + (var(--depth) - 1)*23px);min-height:43px}
.knowledge-document-heading.selected{background:#e9f4ed}
.outline-node-title{min-width:140px;flex:0 1 45%;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:0;text-align:left;font-size:12px;color:#2b503c}
.outline-node-title strong{overflow-wrap:anywhere}
.outline-mark{color:#98a99d;font:11px Consolas,monospace;letter-spacing:0}
.outline-open-indicator{margin-left:auto;color:#91a095}
.outline-summary{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#85958b;font-size:11px}

.knowledge-document-body{margin:0 18px 12px calc(22px + (var(--depth) - 1)*23px);background:#f8faf9;border:1px solid #e4ede7;border-radius:8px;padding:12px 14px;line-height:1.7}

.transfer-visual-head{flex:none}
.transfer-map{flex:1;min-height:0}
.transfer-right-footer{flex:none}

    };
    const merge = (target, incoming, path) => {
      tally.matched++;
      const original = target.content || '';
      if (incoming.content && incoming.content !== original) {
        if (opts.overwriteContent) {
          target.content = incoming.content; tally.updated++;
          touched[target.id]='updated';
          changes.push({type:'updated',id:target.id,path:path.join(' / ')});
        } else {
          tally.kept++; touched[target.id]='matched';
          changes.push({type:'kept',id:target.id,path:path.join(' / ')});
        }
      } else {
        touched[target.id] = 'matched';
      }
      if (!target.children) target.children=[];
      (incoming.children||[]).forEach(child => {
        const existing=target.children.find(n=>n.name===child.name);
        if(existing) merge(existing,child,[...path,child.name]);
        else target.children.push(create(child,path));
      });
    };
    const parent = position==='under' ? findNode(next,parentId) : null;
    const destination = position==='under' ? (parent.children ||= []) : next;
    const destinationPath = position==='under' ? findPath(next,parentId) : [];
    for (const imported of importedRoots) {
      if (position === 'roots') {
        // An independent root must remain independent, even on a name collision.
        const renamed = unique(imported.name, destination);
        if(renamed !== imported.name) tally.renamed++;
        destination.push(create({...imported,name:renamed}, []));
        if(renamed !== imported.name) changes.push({type:'renamed',path:renamed,id:destination[destination.length-1].id});
      } else {
        const existing=destination.find(n=>n.name===imported.name);
        if(existing) merge(existing,imported,[...destinationPath,imported.name]);
        else destination.push(create(imported,destinationPath));
      }
    }
    assertForest(next);
    return {
      roots:next,
      markers:touched,
      stats:{...tally, roots:next.length, nodes:countNodes(next)},
      changes,
      targetLabel:position==='roots'?'创建独立根节点':`作为「${destinationPath.join(' / ')}」的子节点`,
      position,parentId
    };
  }
  return {assertForest,walk,findNode,findPath,countNodes,makeExportPreview,previewImport,emitMarkdown};
});

function parsePaste(text){const parts={};let section='';for(const line of String(text).replace(/\r/g,'').split('\n')){const m=line.match(/^#{1,4}\s*(标题|题干|选项|正确答案|答案|解析|答案解析|知识点|来源|我当时怎么想的|错误原因)\s*$/);if(m){section=m[1];if(!(section in parts))parts[section]='';continue;}if(section)parts[section]+=(parts[section]?'\n':'')+line;}Object.keys(parts).forEach(k=>parts[k]=parts[k].trim());return {...parts,options:(parts['选项']||'').split(/\n/).map(x=>x.trim().replace(/^(?:[A-Z]\s*[.、．：:]|\([A-Z]\))\s*/i,'')).filter(Boolean)};}

function knowledgeTreeText(){
 const walk=(node,depth)=>'  '.repeat(depth)+'- '+node.name+'\n'+(node.children||[]).map(x=>walk(x,depth+1)).join('');
 return knowledgeRoots().map(root=>walk(root,0)).join('');
}
function confirmedKnowledgeText(){
 if(!state.editorKnowledge.length)return '该卡片尚未人工确认任何知识点关联。\n请从候选目录提出建议，不得声称已关联。';
 const rows=[];
 for(const label of state.editorKnowledge){
   const matches=[];KF.walk(knowledgeRoots(),(node,path)=>{if(node.name===label)matches.push(path);});
   if(matches.length===1)rows.push('- '+matches[0].join(' / ')+' [已关联]');
   else if(matches.length>1)rows.push('- '+label+' [重名节点：请人工核对具体路径]');
   else rows.push('- '+label+' [当前图谱未找到同名节点，需核对关联 ID]');
 }
 return rows.join('\n');
}
function scopeText(scopes){
 // 两项独立勾选，可以同时附带；候选目录与已确认关联在文案上严格区分。
 const parts=[];
 if(scopes.includes('full'))parts.push('## 本卡片集知识点目录（仅供 AI 匹配候选，不代表已关联）\n'+knowledgeTreeText());
 if(scopes.includes('partial'))parts.push('## 本卡片已经由用户确认的知识点及其上级路径\n'+confirmedKnowledgeText());
 return parts.length?'\n\n'+parts.join('\n\n'):'';
}
function cardMarkdown(){const c=state.editor[state.editorMode];const common=`## 标题\n${state.editorTitle}\n\n## 来源\n${state.editorSource}\n\n## 知识点\n${state.editorKnowledge.join(' / ')}`;if(state.editorMode==='question')return `## 题干\n${c.stem}\n\n## 选项\n${c.options.map((v,i)=>String.fromCharCode(65+i)+'. '+v).join('\n')}\n\n## 正确答案\n${c.answer==null?'':String.fromCharCode(65+c.answer)}\n\n## 解析\n${c.analysis}\n\n## 我当时怎么想的\n${c.initialThought}\n\n${common}`;if(state.editorMode==='recall')return `## 正面\n${c.front}\n\n## 背面\n${c.back}\n\n## 补充说明\n${c.explanation}\n\n${common}`;return `## 完整记忆内容\n${c.content}\n\n${common}`;}

async function saveTransferMdFile(text){
 const filename=(decks[state.deck].title+'-知识图谱-'+(transfer.selectionMode==='all'?'全部':'选中')).replace(/[\\/:*?"<>|]/g,'_')+'.md';
 try{
   if(typeof window.showSaveFilePicker==='function' && window.isSecureContext){
     const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:'Markdown 文档',accept:{'text/markdown':['.md']}}]});
     const stream=await handle.createWritable();await stream.write(text);await stream.close();
     toast('已保存 Markdown 文件到你选择的位置');return;
   }
   // file:// and some browsers disallow this API; Electron production must use native dialog.showSaveDialog.
   const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));
   const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
   toast('已发起 .md 下载；保存目录由浏览器控制');
 }catch(err){if(err.name!=='AbortError')toast('保存失败：'+(err.message||err));}
}

document.addEventListener('paste',e=>{const target=e.target.closest?.('[contenteditable][data-field]');if(!target)return;const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(!files.length)return;e.preventDefault();files.forEach(file=>{const url=URL.createObjectURL(file);const id=Date.now()+Math.random();const img=document.createElement('img');img.src=url;img.alt=file.name||'粘贴图片';img.width=280;const selection=getSelection();if(selection?.rangeCount){const r=selection.getRangeAt(0);r.deleteContents();r.insertNode(img);r.setStartAfter(img);r.setEndAfter(img);selection.removeAllRanges();selection.addRange(r);}else target.appendChild(img);state.media.push({id,name:file.name||'粘贴图片.png',refs:1});});});
// Optional preview route for offline screenshots: index.html?page=editor&deck=language
const urlArgs=new URLSearchParams(location.search);
if(urlArgs.has('page')&&['overview','deck','cards','filter','review','editor','knowledge','knowledgeTransfer','analytics','exchange','schedule','settings','cardDetail'].includes(urlArgs.get('page')))state.page=urlArgs.get('page');
if(urlArgs.has('deck')&&decks[urlArgs.get('deck')])state.deck=urlArgs.get('deck');
render();

</script>
