name: GankSoft Windows portable build and owner-approved Release
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      reconcile:
        description: "Owner recovery: reconcile all authorized develop merges from baseline"
        required: true
        type: boolean
permissions:
  contents: read
  pull-requests: read
# Build only the current develop SHA, one portable ZIP; no installer, no historical RC queue.
# Release remains gated by owner environment approval; existing tags cannot be replaced.
concurrency:
  group: develop-rc-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - id: plan
        run: |
          echo "count=1" >> "$GITHUB_OUTPUT"
          printf '{"schema":1,"sha":"%s"}\n' "$GITHUB_SHA" > plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-plan
          path: plan.json
          if-no-files-found: error
          retention-days: 14
  quality:
    needs: preflight
    if: needs.preflight.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-plan
      - name: Install coordinator dependencies (locked, including dev)
        run: npm ci --include=dev
      - run: npm run test:pipeline
      - run: npm run ci:quality
      - if: runner.os == 'Linux'
        run: node tools/validation/package-check.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-${{ matrix.os }}
          path: validation-results/
          retention-days: 14
  security:
    needs: preflight
    if: needs.preflight.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rc-plan
      - name: Install coordinator dependencies (locked, including dev)
        run: npm ci --include=dev
      - run: npm run pipeline:security
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: validation-results/
          retention-days: 14
  windows-package:
    needs: [preflight, quality, security]
    if: needs.preflight.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rc-plan
      - name: Install coordinator dependencies (locked, including dev)
        run: npm ci --include=dev
      - id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: npm run build
      - run: node tools/package-windows.mjs
      - run: node tools/ci/portable-only.mjs prepare
      - name: Actual Windows portable application smoke
        run: node tools/ci/windows-smoke.mjs out/GankSoft-win32-x64/resources/app.asar out/GankSoft-win32-x64/GankSoft.exe portable
      - name: Verify packaged EXE version
        run: node tools/ci/windows-version.mjs verify out/GankSoft-win32-x64/GankSoft.exe ${{ steps.version.outputs.version }} application
      - run: python tools/build/zip-windows.py out/GankSoft-win32-x64 artifacts/GankSoft-v${{ steps.version.outputs.version }}-win64-portable.zip GankSoft
      - shell: pwsh
        run: |
          & tools/ci/windows-extract.ps1 -Archive "artifacts/GankSoft-v${{ steps.version.outputs.version }}-win64-portable.zip" -Report "validation-results/ci/zip-extraction.json" -Metadata "validation-results/ci/source.json"
      - run: node tools/ci/portable-only.mjs finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-packages
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build-reports
          path: validation-results/**/reports/
          retention-days: 14
  artifact-verify:
    needs: [preflight, quality, security, windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rc-packages
          path: artifacts
      - run: node tools/ci/portable-only.mjs verify artifacts
  release-rc:
    needs: [artifact-verify]
    environment:
      name: rc-publish-owner
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    timeout-minutes: 30
    concurrency:
      group: ganksoft-owner-rc-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rc-packages
          path: artifacts
      - run: node tools/ci/portable-only.mjs verify artifacts
      - name: Publish verified portable ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$tag" \
            "artifacts/GankSoft-v${version}-win64-portable.zip" \
            artifacts/SHA256SUMS.txt artifacts/source.json artifacts/TEST_REPORT.json \
            --target "$GITHUB_SHA" --title "GankSoft v${version} (Windows portable)" \
            --notes "Windows 10/11 x64 portable ZIP. Extract it first, then run GankSoft.exe. Automated Windows smoke and ZIP checks passed; manual Win10/11 testing is NOT_RUN." \
            --prerelease --latest=false
  report:
    if: always()
    needs:
      [
        preflight,
        quality,
        security,
        windows-package,
        artifact-verify,
        release-rc,
      ]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
