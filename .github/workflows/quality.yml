name: GankSoft quality and Windows test package
on:
  push:
    branches: [develop, "feature/**", "infra/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ganksoft-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  GANKSOFT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GANKSOFT_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GANKSOFT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Static, types, unit, API, database and regression gates
        run: npm run ci:quality
      - name: Linux ASAR and UI regressions
        if: runner.os == 'Linux'
        run: node tools/validation/package-check.mjs
      - name: Preserve test reports and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
  windows-package:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GANKSOFT_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run build
      - name: Source identity
        id: source
        run: node tools/ci/metadata.mjs
      - name: Build, launch, GUI, isolated data, install and uninstall
        shell: pwsh
        run: ./tools/ci/windows-package.ps1
      - name: Upload validated test package (never a Release)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-reports-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
