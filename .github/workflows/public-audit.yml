name: GankSoft public-readiness history audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    if: github.actor == 'Aides8Stack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: node tools/pipeline/history-audit.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-history-audit-${{ github.sha }}
          path: validation-results/public-history-audit.json
          retention-days: 14
